<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador PRO de Webs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>

<body>

<div class="app">

  <div class="panel">
    <h2>Generador de Webs</h2>

    <input id="negocio" placeholder="Negocio (ej: Aire acondicionado)">
<input id="ciudad" placeholder="Ciudad">
<input id="direccion" placeholder="Dirección (ej: Calle Mayor 12, Murcia)">
<input id="telefono" placeholder="Teléfono">
<input id="whatsapp" placeholder="WhatsApp">
<input id="servicios" placeholder="Servicios separados por coma">

    <select id="plantilla">
      <option value="oscuro">Diseño oscuro</option>
      <option value="claro">Diseño claro</option>
    </select>

    <button onclick="generarWeb()">Generar</button>
    <button onclick="descargar()">Descargar</button>

  </div>

  <div class="preview">
    <iframe id="frame"></iframe>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
