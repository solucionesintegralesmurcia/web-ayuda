<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador PRO de Webs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
</head>

<body>

<div class="app">

  <div class="panel">
    <h2>Generador PRO de Webs</h2>

    <select id="sector">
      <option value="generico">Sector genérico</option>
      <option value="peluqueria">Peluquería</option>
      <option value="aire">Aire acondicionado</option>
      <option value="cerrajeria">Cerrajería / Metalistería</option>
      <option value="jardineria">Jardinería</option>
      <option value="electricista">Electricista</option>
      <option value="reformas">Reformas</option>
      <option value="restaurante">Restaurante / Bar</option>
      <option value="dentista">Clínica dental</option>
      <option value="limpieza">Limpieza</option>
      <option value="piscinas">Piscinas</option>
      <option value="abogado">Abogado</option>
    </select>

    <select id="plantilla">
      <option value="profesional">Profesional</option>
      <option value="impacto">Impacto</option>
      <option value="premium">Premium</option>
      <option value="simple">Simple</option>
      <option value="local">Local directo</option>
    </select>

    <select id="paleta">
      <option value="verde">Verde profesional</option>
      <option value="azul">Azul confianza</option>
      <option value="negro">Negro premium</option>
      <option value="rojo">Rojo comercial</option>
      <option value="rosa">Rosa belleza</option>
      <option value="dorado">Dorado elegante</option>
    </select>

    <select id="cantidadServicios">
      <option value="3">3 servicios</option>
      <option value="4" selected>4 servicios</option>
      <option value="5">5 servicios</option>
      <option value="6">6 servicios</option>
    </select>

    <input id="negocio" placeholder="Nombre del negocio">
    <input id="ciudad" placeholder="Ciudad">
    <input id="direccion" placeholder="Dirección">
    <input id="telefono" placeholder="Teléfono">
    <input id="whatsapp" placeholder="WhatsApp">
    <input id="servicios" placeholder="Servicios separados por coma">

    <button onclick="rellenarAutomatico()">Rellenar automático</button>
    <button onclick="generarWeb()">Generar web</button>
    <button id="btnVerWeb" onclick="verWebCompleta()">Ver web completa</button>
    <button onclick="descargar()">Descargar ZIP</button>
    <button onclick="nuevoProyecto()">Nuevo proyecto</button>
    <button onclick="copiarMensajeCliente()">Copiar mensaje cliente</button>
    <hr class="panel-separator">
    <hr class="panel-separator">

<h3>Preparar fotos de esta web</h3>

<select id="sectorFotos">
  <option value="generico">Genérico</option>
  <option value="peluqueria">Peluquería</option>
  <option value="aire">Aire acondicionado</option>
  <option value="cerrajeria">Cerrajería</option>
  <option value="jardineria">Jardinería</option>
  <option value="electricista">Electricista</option>
  <option value="reformas">Reformas</option>
  <option value="restaurante">Restaurante</option>
  <option value="dentista">Dentista</option>
  <option value="limpieza">Limpieza</option>
  <option value="piscinas">Piscinas</option>
  <option value="abogado">Abogado</option>
</select>

<input id="fotosWeb" type="file" multiple accept="image/*">

<div id="tablaFotos"></div>

<button onclick="generarTablaFotos()">Preparar fotos</button>
<button onclick="descargarZipFotos()">Descargar img.zip</button>

<h3>Preparar imágenes</h3>

<select id="tipoImagen">
  <option value="sector">Imagen de sector</option>
  <option value="servicio">Imagen de servicio</option>
</select>

<select id="sectorImagen">
  <option value="generico">generico.jpg</option>
  <option value="peluqueria">peluqueria.jpg</option>
  <option value="aire">aire.jpg</option>
  <option value="cerrajeria">cerrajeria.jpg</option>
  <option value="jardineria">jardineria.jpg</option>
  <option value="electricista">electricista.jpg</option>
  <option value="reformas">reformas.jpg</option>
  <option value="restaurante">restaurante.jpg</option>
  <option value="dentista">dentista.jpg</option>
  <option value="limpieza">limpieza.jpg</option>
  <option value="piscinas">piscinas.jpg</option>
  <option value="abogado">abogado.jpg</option>
</select>

<input id="nombreServicioImagen" placeholder="Nombre del servicio, ej: Mechas balayage">

<input id="archivoImagen" type="file" accept="image/*">

<button onclick="descargarImagenRenombrada()">Descargar imagen renombrada</button>

<hr class="panel-separator">

<h3>Crear carpeta img.zip</h3>

<input id="imagenesLote" type="file" accept="image/*" multiple>

<div id="listaImagenes"></div>

<button onclick="prepararImagenesLote()">Preparar imágenes</button>
<button onclick="descargarZipImagenes()">Descargar img.zip</button>

</div>

  <div class="preview">
    <iframe id="frame"></iframe>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
