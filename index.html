<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Ayuda Pro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Web Ayuda Pro</h1>

<div class="container">

<div class="form">

<input id="nombre" placeholder="Nombre negocio">
<input id="sector" placeholder="Sector">
<input id="ciudad" placeholder="Ciudad">
<input id="telefono" placeholder="Teléfono">

<input id="serv1" placeholder="Servicio 1">
<input id="serv2" placeholder="Servicio 2">
<input id="serv3" placeholder="Servicio 3">
<input id="serv4" placeholder="Servicio 4">

<button onclick="generarWeb()">GENERAR WEB</button>
<button onclick="nuevoNegocio()">NUEVO CLIENTE</button>

</div>

<div class="output">

<h3>SEO</h3>
<textarea id="seoOutput"></textarea>

<h3>HTML</h3>
<textarea id="htmlOutput"></textarea>

<h3>CSS</h3>
<textarea id="cssOutput"></textarea>

</div>

<div class="preview">
<h3>Vista previa</h3>
<iframe id="previewFrame"></iframe>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
