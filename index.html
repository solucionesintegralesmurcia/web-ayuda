<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Ayuda Pro | Generador de webs locales</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div>
        <h1>Web Ayuda Pro</h1>
        <p>Generador gratuito de webs locales listas para GitHub</p>
      </div>
      <div class="topbar-badge">Versión completa sin IA</div>
    </div>
  </header>

  <main class="container app-grid">
    <section class="panel form-panel">
      <h2>Datos del negocio</h2>

      <div class="field-grid two">
        <div class="field">
          <label for="nombre">Nombre del negocio</label>
          <input type="text" id="nombre" placeholder="Ej. Peluquería Paqui" />
        </div>
        <div class="field">
          <label for="sector">Sector</label>
          <input type="text" id="sector" placeholder="Ej. peluquería unisex" />
        </div>
      </div>

      <div class="field-grid two">
        <div class="field">
          <label for="ciudad">Ciudad</label>
          <input type="text" id="ciudad" placeholder="Ej. Murcia" />
        </div>
        <div class="field">
          <label for="telefono">Teléfono / WhatsApp</label>
          <input type="text" id="telefono" placeholder="Ej. 34639111111" />
        </div>
      </div>

      <div class="field-grid two">
        <div class="field">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" placeholder="Ej. Calle Mayor 12, Murcia" />
        </div>
        <div class="field">
          <label for="zona">Zonas de trabajo</label>
          <input type="text" id="zona" placeholder="Ej. Murcia, Alcantarilla, Molina de Segura" />
        </div>
      </div>

      <div class="field">
        <label for="descripcion">Descripción corta</label>
        <textarea id="descripcion" placeholder="Ej. Negocio local especializado en... "></textarea>
      </div>

      <div class="field-grid three">
        <div class="field">
          <label for="anos">Años de experiencia</label>
          <input type="text" id="anos" placeholder="Ej. 10" />
        </div>
        <div class="field">
          <label for="ctaTexto">Texto botón principal</label>
          <input type="text" id="ctaTexto" placeholder="Ej. Pedir cita por WhatsApp" />
        </div>
        <div class="field">
          <label for="mensajeWhatsapp">Mensaje WhatsApp</label>
          <input type="text" id="mensajeWhatsapp" placeholder="Ej. Hola, quiero información" />
        </div>
      </div>

      <h3>Servicios o productos</h3>
      <div class="field-grid two">
        <div class="field"><label for="serv1">Servicio 1</label><input type="text" id="serv1" placeholder="Ej. Corte de pelo" /></div>
        <div class="field"><label for="serv2">Servicio 2</label><input type="text" id="serv2" placeholder="Ej. Tinte" /></div>
        <div class="field"><label for="serv3">Servicio 3</label><input type="text" id="serv3" placeholder="Ej. Mechas" /></div>
        <div class="field"><label for="serv4">Servicio 4</label><input type="text" id="serv4" placeholder="Ej. Peinados" /></div>
      </div>

      <h3>Sobre nosotros</h3>
      <div class="field-grid two">
        <div class="field">
          <label for="sobreTitulo">Título del bloque</label>
          <input type="text" id="sobreTitulo" placeholder="Ej. Atención cercana y resultados cuidados" />
        </div>
        <div class="field">
          <label for="sobreTexto">Texto del bloque</label>
          <textarea id="sobreTexto" placeholder="Ej. En nuestro negocio apostamos por..."></textarea>
        </div>
      </div>

      <h3>Reseñas</h3>
      <div class="review-grid">
        <div class="field"><label for="resena1Nombre">Cliente 1</label><input type="text" id="resena1Nombre" placeholder="Ej. Ana" /></div>
        <div class="field"><label for="resena1Texto">Reseña 1</label><textarea id="resena1Texto" placeholder="Ej. Muy contenta con el trato..."></textarea></div>
        <div class="field"><label for="resena2Nombre">Cliente 2</label><input type="text" id="resena2Nombre" placeholder="Ej. Pedro" /></div>
        <div class="field"><label for="resena2Texto">Reseña 2</label><textarea id="resena2Texto" placeholder="Ej. Profesionalidad y rapidez..."></textarea></div>
        <div class="field"><label for="resena3Nombre">Cliente 3</label><input type="text" id="resena3Nombre" placeholder="Ej. Laura" /></div>
        <div class="field"><label for="resena3Texto">Reseña 3</label><textarea id="resena3Texto" placeholder="Ej. Repetiré sin duda..."></textarea></div>
      </div>

      <h3>Imágenes</h3>
      <div class="field-grid two">
        <div class="field"><label for="img1">Portada</label><input type="file" id="img1" accept="image/*" onchange="mostrarPreview()" /></div>
        <div class="field"><label for="img2">Galería 1</label><input type="file" id="img2" accept="image/*" onchange="mostrarPreview()" /></div>
        <div class="field"><label for="img3">Galería 2</label><input type="file" id="img3" accept="image/*" onchange="mostrarPreview()" /></div>
        <div class="field"><label for="img4">Galería 3</label><input type="file" id="img4" accept="image/*" onchange="mostrarPreview()" /></div>
      </div>
      <div id="preview" class="preview-grid"></div>

      <h3>Diseño</h3>
      <div class="field-grid three">
        <div class="field">
          <label for="plantilla">Plantilla</label>
          <select id="plantilla">
            <option value="profesional">Profesional</option>
            <option value="tradicional">Tradicional</option>
            <option value="premium">Premium</option>
          </select>
        </div>
        <div class="field">
          <label for="modoPagina">Tipo de web</label>
          <select id="modoPagina">
            <option value="completa">Web completa</option>
            <option value="landing">Landing rápida</option>
          </select>
        </div>
        <div class="field">
          <label for="color">Color principal</label>
          <input type="color" id="color" value="#8b5e3c" />
        </div>
      </div>

      <div class="actions sticky-actions">
        <button class="btn-main" onclick="generarWeb()">Generar web</button>
        <button class="btn-secondary" onclick="guardarFormulario()">Guardar datos</button>
      </div>
    </section>

    <section class="panel output-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="previewTab" onclick="cambiarTab(event)">Vista previa</button>
        <button class="tab-btn" data-tab="seoTab" onclick="cambiarTab(event)">SEO</button>
        <button class="tab-btn" data-tab="htmlTab" onclick="cambiarTab(event)">index.html</button>
        <button class="tab-btn" data-tab="cssTab" onclick="cambiarTab(event)">style.css</button>
        <button class="tab-btn" data-tab="notasTab" onclick="cambiarTab(event)">Notas</button>
      </div>

      <div class="tab-panel active" id="previewTab">
        <div class="tab-actions">
          <button onclick="generarWeb()">Actualizar vista previa</button>
        </div>
        <iframe id="previewFrame" title="Vista previa de la web generada"></iframe>
      </div>

      <div class="tab-panel" id="seoTab">
        <div class="output-head">
          <h3>SEO básico</h3>
          <button onclick="copiarTexto('seoOutput')">Copiar SEO</button>
        </div>
        <textarea id="seoOutput" readonly></textarea>
      </div>

      <div class="tab-panel" id="htmlTab">
        <div class="output-head">
          <h3>index.html</h3>
          <div class="mini-actions">
            <button onclick="copiarTexto('htmlOutput')">Copiar</button>
            <button onclick="descargarArchivo('htmlOutput','index.html','text/html')">Descargar</button>
          </div>
        </div>
        <textarea id="htmlOutput" readonly></textarea>
      </div>

      <div class="tab-panel" id="cssTab">
        <div class="output-head">
          <h3>style.css</h3>
          <div class="mini-actions">
            <button onclick="copiarTexto('cssOutput')">Copiar</button>
            <button onclick="descargarArchivo('cssOutput','style.css','text/css')">Descargar</button>
          </div>
        </div>
        <textarea id="cssOutput" readonly></textarea>
      </div>

      <div class="tab-panel" id="notasTab">
        <div class="output-head">
          <h3>Notas rápidas</h3>
          <button onclick="copiarTexto('notasOutput')">Copiar notas</button>
        </div>
        <textarea id="notasOutput" readonly></textarea>
      </div>

      <div class="download-bar">
        <button onclick="descargarProyectoZIP()">Descargar proyecto ZIP</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
