<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Webs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Generador de Webs Locales</h1>

  <input id="negocio" placeholder="Tipo de negocio (ej: Aire acondicionado)">
  <input id="ciudad" placeholder="Ciudad (ej: Murcia)">
  <input id="telefono" placeholder="Teléfono">
  <input id="whatsapp" placeholder="WhatsApp (sin +34)">
  <input id="servicios" placeholder="Servicios separados por coma">

  <button onclick="generarWeb()">Generar Web</button>

  <textarea id="resultado" placeholder="Aquí aparecerá el código"></textarea>

  <button onclick="descargar()">Descargar HTML</button>
</div>

<script src="script.js"></script>
</body>
</html>
